trigger:
  branches:
    include:
      - main
      - feature/*

name: todo-infra
pool: groupofagents

stages:
# ================= PRE-COMMIT =================
- stage: PreCommit
  displayName: Pre-Commit / Static Analysis
  jobs:
  - job: LintAndScan
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.x'

    - script: |
        curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
        sudo apt-add-repository "deb https://apt.releases.hashicorp.com $(lsb_release -cs) main"
        sudo apt-get update && sudo apt-get install terraform -y
        terraform version
      displayName: Install Terraform

    - script: |
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        tflint --version
      displayName: Install tflint

    - script: |
        terraform init -backend=false
        terraform fmt -check -recursive
        terraform validate
      displayName: Terraform fmt & validate

    - script: |
        curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_tfsec.sh | bash
        tfsec .
      displayName: Run tfsec

    - script: |
        pip install checkov
        checkov -d .
      displayName: Run Checkov

# ================= PLAN =================
- stage: Plan
  dependsOn: PreCommit
  jobs:
  - job: TerraformPlan
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        terraform init
        terraform plan -out=tfplan.binary
      displayName: Terraform Plan

    - publish: tfplan.binary
      artifact: tfplan

# ================= COST =================
- stage: CostEstimate
  dependsOn: Plan
  jobs:
  - job: Infracost
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        curl -sL https://github.com/infracost/infracost/releases/latest/download/infracost-linux-amd64.tar.gz | tar xz
        sudo mv infracost-linux-amd64 /usr/local/bin/infracost
        infracost breakdown --path=tfplan.binary
      env:
        INFRACOST_API_KEY: $(INFRACOST_API_KEY)
      displayName: Infracost Estimate

# ================= TEST =================
- stage: Test
  dependsOn: CostEstimate
  jobs:
  - job: Terratest
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        sudo apt-get update
        sudo apt-get install -y golang-go
        cd test
        go test -v ./...
      displayName: Run Terratest

# ================= APPROVAL =================
- stage: ManualApproval
  dependsOn: Test
  jobs:
  - job: Approval
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: 'udbhavchauhan97@gmail.com'
        instructions: 'Review plan, security & cost. Approve to apply.'

# ================= APPLY =================
- stage: Apply
  dependsOn: ManualApproval
  displayName: Deploy / Apply
  jobs:
  - job: TerraformApply
    pool:
      vmImage: ubuntu-latest
    steps:
    - download: current
      artifact: tfplan

    - script: |
        terraform init
        terraform apply -auto-approve tfplan.binary
      displayName: Terraform Apply
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)

 